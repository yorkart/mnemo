<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemo 记忆系统 — 交互式数据流演示</title>
<style>
:root {
  --bg: #0f1117;
  --panel-bg: #1a1d27;
  --card-bg: #232733;
  --border: #2e3344;
  --accent: #6c8cff;
  --accent2: #4ecdc4;
  --accent3: #ff6b9d;
  --text: #e4e6ed;
  --text2: #9ca0b0;
  --user-bubble: #2d5af0;
  --bot-bubble: #2a2e3e;
  --green: #4ecdc4;
  --orange: #ffa64d;
  --red: #ff6b6b;
  --yellow: #ffd93d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
}
.header h1 {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 .logo { color: var(--accent); }

/* Progress */
.progress-bar {
  display: flex;
  gap: 4px;
  align-items: center;
}
.progress-dot {
  width: 28px;
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  transition: all 0.4s ease;
  cursor: pointer;
  position: relative;
}
.progress-dot.active {
  background: var(--accent);
  width: 40px;
}
.progress-dot.done {
  background: var(--green);
}
.progress-dot:hover::after {
  content: attr(data-label);
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 11px;
  background: #333;
  padding: 3px 8px;
  border-radius: 4px;
  color: #fff;
  z-index: 10;
}

/* Main layout */
.main {
  display: flex;
  height: calc(100vh - 53px - 100px);
}

/* Chat Panel */
.chat-panel {
  width: 38%;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.session-label {
  font-size: 11px;
  background: var(--card-bg);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text2);
  margin-left: auto;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  animation: msgIn 0.4s ease;
  opacity: 0;
  transform: translateY(10px);
}
.msg.visible {
  opacity: 1;
  transform: translateY(0);
  transition: all 0.4s ease;
}
.msg.user {
  align-self: flex-end;
  background: var(--user-bubble);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bot-bubble);
  border-bottom-left-radius: 4px;
}
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--text2);
  font-size: 11px;
  padding: 4px 12px;
  border: 1px dashed var(--border);
  border-radius: 20px;
}
.msg-label {
  font-size: 10px;
  color: var(--text2);
  margin-bottom: 4px;
}
.msg-meta {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
  text-align: right;
}
.msg.bot .msg-meta { color: var(--text2); }

/* Data flow arrow in the middle */
.flow-bridge {
  width: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.flow-arrow {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: all 0.5s ease;
}
.flow-arrow.visible {
  opacity: 1;
}
.flow-arrow.right { flex-direction: row; }
.flow-arrow.left { flex-direction: row-reverse; }
.flow-arrow .arrow-line {
  width: 20px;
  height: 2px;
  border-radius: 1px;
}
.flow-arrow.right .arrow-line { background: linear-gradient(to right, var(--accent), var(--accent2)); }
.flow-arrow.left .arrow-line { background: linear-gradient(to left, var(--accent2), var(--accent)); }
.flow-arrow .arrow-head {
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
}
.flow-arrow.right .arrow-head { border-left: 7px solid var(--accent2); }
.flow-arrow.left .arrow-head { border-right: 7px solid var(--accent); }
.flow-arrow .arrow-label {
  font-size: 9px;
  color: var(--text2);
  writing-mode: vertical-lr;
  transform: rotate(180deg);
  letter-spacing: 1px;
  position: absolute;
  top: -32px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  writing-mode: horizontal-tb;
}

/* Mnemo Panel */
.mnemo-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.mnemo-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mnemo-header .icon { color: var(--accent); font-size: 16px; }
.mnemo-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.mnemo-content::-webkit-scrollbar { width: 4px; }
.mnemo-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Processing cards */
.process-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  overflow: hidden;
  opacity: 0;
  transform: translateX(20px);
}
.process-card.visible {
  opacity: 1;
  transform: translateX(0);
  transition: all 0.4s ease;
}
.process-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
}
.process-card-header .step-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}
.process-card-body {
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
}

/* Code block */
.code-block {
  background: #1a1d27;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 11px;
  line-height: 1.5;
  overflow-x: auto;
  margin: 6px 0;
  white-space: pre;
  color: var(--text2);
}
.code-block .key { color: var(--accent); }
.code-block .str { color: var(--green); }
.code-block .num { color: var(--orange); }
.code-block .comment { color: #555; font-style: italic; }
.code-block .highlight { color: var(--yellow); }
.code-block .warn { color: var(--accent3); }

/* DB table viz */
.db-table {
  width: 100%;
  font-size: 11px;
  border-collapse: collapse;
  margin: 6px 0;
}
.db-table th {
  background: #1a1d27;
  padding: 5px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
}
.db-table td {
  padding: 4px 8px;
  border-bottom: 1px solid #1e2230;
  color: var(--text2);
}
.db-table tr.new td {
  color: var(--green);
  background: rgba(78,205,196,0.05);
}
.db-table tr.excluded td {
  color: var(--text2);
  opacity: 0.5;
  text-decoration: line-through;
}

/* Tags */
.tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
}
.tag.green { background: rgba(78,205,196,0.15); color: var(--green); }
.tag.blue { background: rgba(108,140,255,0.15); color: var(--accent); }
.tag.orange { background: rgba(255,166,77,0.15); color: var(--orange); }
.tag.red { background: rgba(255,107,107,0.15); color: var(--red); }
.tag.yellow { background: rgba(255,217,61,0.15); color: var(--yellow); }

/* Namespace tree */
.ns-tree { padding: 6px 0; font-size: 12px; }
.ns-tree .ns-node {
  padding: 3px 0 3px 16px;
  border-left: 2px solid var(--border);
  margin-left: 8px;
  position: relative;
}
.ns-tree .ns-node::before {
  content: '';
  position: absolute;
  left: -2px;
  top: 12px;
  width: 12px;
  height: 2px;
  background: var(--border);
}
.ns-tree .ns-node.active { border-left-color: var(--accent); }
.ns-tree .ns-node.active::before { background: var(--accent); }
.ns-tree .ns-node .ns-label {
  font-family: monospace;
  color: var(--text2);
}
.ns-tree .ns-node.active .ns-label { color: var(--accent); font-weight: 600; }
.ns-tree .ns-root { font-weight: 600; color: var(--text); padding: 2px 0; }

/* Score bar */
.score-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 3px 0;
  font-size: 11px;
}
.score-label { width: 72px; color: var(--text2); text-align: right; flex-shrink: 0; }
.score-bar-bg {
  flex: 1;
  height: 14px;
  background: #1a1d27;
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.score-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.score-val { width: 36px; font-family: monospace; font-size: 10px; color: var(--text2); }

/* Bottom panel */
.bottom-panel {
  height: 100px;
  border-top: 1px solid var(--border);
  background: var(--panel-bg);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
}
.step-info {
  flex: 1;
  min-width: 0;
}
.step-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-title .step-badge {
  font-size: 11px;
  background: var(--accent);
  color: #fff;
  padding: 1px 8px;
  border-radius: 10px;
}
.step-desc {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.nav-btns {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.nav-btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover { border-color: var(--accent); background: rgba(108,140,255,0.1); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn:disabled:hover { border-color: var(--border); background: var(--card-bg); }
.nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.nav-btn.primary:hover { background: #5a7aee; }
.nav-btn.primary:disabled { background: var(--border); border-color: var(--border); }

/* Animation for flow pulses */
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
.pulse { animation: pulse 1.5s ease infinite; }

/* Ranking card */
.rank-card {
  background: #1a1d27;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  margin: 6px 0;
}
.rank-card.top { border-left: 3px solid var(--green); }
.rank-card.low { border-left: 3px solid var(--border); }
.rank-title {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.rank-score { color: var(--green); font-family: monospace; }

/* Flow steps */
.flow-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 8px 0;
}
.flow-step .flow-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.flow-step .flow-icon.db { background: rgba(108,140,255,0.15); color: var(--accent); }
.flow-step .flow-icon.ai { background: rgba(78,205,196,0.15); color: var(--green); }
.flow-step .flow-icon.check { background: rgba(255,166,77,0.15); color: var(--orange); }
.flow-step .flow-icon.warn { background: rgba(255,107,107,0.15); color: var(--red); }
.flow-step .flow-text { font-size: 12px; line-height: 1.5; color: var(--text2); }
.flow-step .flow-text strong { color: var(--text); font-weight: 600; }

.flow-connector {
  width: 2px;
  height: 12px;
  background: var(--border);
  margin-left: 13px;
}

/* Context pack output */
.ctx-output {
  background: #0d1117;
  border: 1px solid #238636;
  border-radius: 6px;
  padding: 10px 12px;
  font-family: monospace;
  font-size: 11px;
  line-height: 1.6;
  color: var(--green);
  margin: 6px 0;
}

/* New session divider */
.session-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0 8px;
  color: var(--text2);
  font-size: 11px;
}
.session-divider::before,
.session-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1><span class="logo">◆</span> Mnemo 记忆系统 — 数据流交互演示</h1>
  <div class="progress-bar" id="progressBar"></div>
</div>

<!-- Main -->
<div class="main">
  <!-- Chat Panel -->
  <div class="chat-panel">
    <div class="chat-header">
      <span class="dot"></span>
      <span>用户 &amp; Bot 对话</span>
      <span class="session-label" id="sessionLabel">session-001</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
  </div>

  <!-- Flow Bridge -->
  <div class="flow-bridge" id="flowBridge">
    <div class="flow-arrow right visible" id="flowArrow1" style="top:30%">
      <span class="arrow-line"></span>
      <span class="arrow-head"></span>
    </div>
    <div class="flow-arrow left" id="flowArrow2" style="top:60%">
      <span class="arrow-head"></span>
      <span class="arrow-line"></span>
    </div>
  </div>

  <!-- Mnemo Panel -->
  <div class="mnemo-panel">
    <div class="mnemo-header">
      <span class="icon">⚙</span>
      <span>Mnemo 内部处理</span>
      <span class="tag blue" id="mnemoStatus">就绪</span>
    </div>
    <div class="mnemo-content" id="mnemoContent"></div>
  </div>
</div>

<!-- Bottom -->
<div class="bottom-panel">
  <div class="step-info">
    <div class="step-title">
      <span class="step-badge" id="stepBadge">1/8</span>
      <span id="stepTitle">数据隔离模型</span>
    </div>
    <div class="step-desc" id="stepDesc">Namespace 六元组构成数据隔离的基础</div>
  </div>
  <div class="nav-btns">
    <button class="nav-btn" id="resetBtn" onclick="reset()">↺ 重置</button>
    <button class="nav-btn" id="prevBtn" onclick="prev()" disabled>← 上一步</button>
    <button class="nav-btn primary" id="nextBtn" onclick="next()">下一步 →</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// Steps definition
// ═══════════════════════════════════════════════════════════════════
const steps = [
  // ─── Step 0: Namespace & Isolation ───
  {
    title: '数据隔离模型',
    desc: 'Namespace 由 6 个维度组成（tenant → user → workspace → thread → agent → source），形成从粗到细的层级树。每一层的数据通过 namespace_key 隔离存储，召回时通过 QueryScope 控制向上查找哪些层级的记忆。',
    session: 'session-001',
    chat: [
      { type:'system', text:'开发者小王（user: wang）加入了 acme 团队的 backend-api 项目' },
    ],
    arrow: { right: true, left: false, rightLabel: '', leftLabel: '' },
    mnemo: () => `
      <div class="process-card visible">
        <div class="process-card-header">
          <div class="step-num">N</div> Namespace 层级结构
        </div>
        <div class="process-card-body">
          <div class="ns-tree">
            <div class="ns-root">🏢 tenant_id: "acme" <span class="tag orange">公司/团队级</span></div>
            <div class="ns-node active">
              <span class="ns-label">👤 user_id: "wang"</span> <span class="tag blue">用户级</span>
              <div class="ns-node active">
                <span class="ns-label">📁 workspace_id: "backend-api"</span> <span class="tag green">项目级</span>
                <div class="ns-node active">
                  <span class="ns-label">💬 thread_id: "session-001"</span> <span class="tag yellow">会话级</span>
                </div>
                <div class="ns-node">
                  <span class="ns-label">💬 thread_id: "session-002"</span>
                </div>
              </div>
              <div class="ns-node">
                <span class="ns-label">📁 workspace_id: "mobile-app"</span>
                <div class="ns-node">
                  <span class="ns-label">💬 thread_id: "session-003"</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="process-card visible">
        <div class="process-card-header">
          <div class="step-num">K</div> namespace_key 生成
        </div>
        <div class="process-card-body">
          <div class="code-block"><span class="key">tenant</span>=<span class="str">acme</span>|<span class="key">user</span>=<span class="str">wang</span>|<span class="key">workspace</span>=<span class="str">backend-api</span>|<span class="key">thread</span>=<span class="str">session-001</span>|<span class="key">agent</span>=|<span class="key">source</span>=</div>
          <div style="margin-top:8px;font-size:11px;color:var(--text2)">
            召回时 <span class="tag blue">QueryScope</span> 控制查找范围：<br>
            <code>include_thread=true</code> → 当前会话记忆<br>
            <code>include_workspace=true</code> → + 项目级记忆（跨 thread）<br>
            <code>include_user=true</code> → + 用户级记忆（跨 workspace）<br>
            <code>include_tenant=false</code> → 不查公司级
          </div>
        </div>
      </div>
    `,
  },

  // ─── Step 1: Event ingest 1 ───
  {
    title: '事件写入 — 用户消息',
    desc: '用户消息作为 Event 写入。通过 (namespace_key, event_id) 去重，同一 event_id 内容一致返回 deduplicated，不一致返回 conflict。memory_hints.eligible=true 表示该事件参与后续 wrapup 抽取。',
    session: 'session-001',
    chat: [
      { type:'user', text:'我们项目统一用 Rust 写后端，请记住这个约定', meta:'evt-0001 · 10:00' },
    ],
    arrow: { right: true, left: false, rightLabel: 'POST /v1/events' },
    mnemo: () => `
      <div class="process-card visible">
        <div class="process-card-header">
          <div class="step-num">1</div> 请求数据
        </div>
        <div class="process-card-body">
          <div class="code-block">{
  <span class="key">"event_id"</span>: <span class="str">"evt-0001"</span>,
  <span class="key">"namespace"</span>: { <span class="key">"tenant_id"</span>: <span class="str">"acme"</span>, <span class="key">"user_id"</span>: <span class="str">"wang"</span>,
               <span class="key">"workspace_id"</span>: <span class="str">"backend-api"</span>, <span class="key">"thread_id"</span>: <span class="str">"session-001"</span> },
  <span class="key">"role"</span>: <span class="str">"user"</span>,
  <span class="key">"content"</span>: <span class="str">"我们项目统一用 Rust 写后端，请记住这个约定"</span>,
  <span class="key">"memory_hints"</span>: { <span class="key">"eligible"</span>: <span class="num">true</span>, <span class="key">"external_context"</span>: <span class="num">false</span> }
}</div>
        </div>
      </div>
      <div class="process-card visible">
        <div class="process-card-header">
          <div class="step-num">2</div> 内部处理流程
        </div>
        <div class="process-card-body">

// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════
let current = 0;

// ═══════════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════════
function render() {
  const step = steps[current];

  // Progress bar
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  steps.forEach((s, i) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i === current ? ' active' : i < current ? ' done' : '');
    dot.dataset.label = s.title;
    dot.onclick = () => { current = i; render(); };
    bar.appendChild(dot);
  });

  // Session label
  document.getElementById('sessionLabel').textContent = step.session;

  // Chat
  const chat = document.getElementById('chatMessages');
  chat.innerHTML = '';
  step.chat.forEach((msg, i) => {
    const div = document.createElement('div');
    div.className = `msg ${msg.type}`;
    let inner = '';
    if (msg.type === 'user') inner += '<div class="msg-label">👤 小王 (wang)</div>';
    if (msg.type === 'bot') inner += '<div class="msg-label">🤖 AI Assistant</div>';
    inner += `<div>${msg.text}</div>`;
    if (msg.meta) inner += `<div class="msg-meta">${msg.meta}</div>`;
    div.innerHTML = inner;
    chat.appendChild(div);
    setTimeout(() => div.classList.add('visible'), 80 * i);
  });
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 100);

  // Arrows
  const fa1 = document.getElementById('flowArrow1');
  const fa2 = document.getElementById('flowArrow2');
  fa1.className = `flow-arrow right ${step.arrow.right ? 'visible' : ''}`;
  fa2.className = `flow-arrow left ${step.arrow.left ? 'visible' : ''}`;
  // Labels
  fa1.innerHTML = `<span class="arrow-label">${step.arrow.rightLabel || ''}</span><span class="arrow-line"></span><span class="arrow-head"></span>`;
  fa2.innerHTML = `<span class="arrow-label">${step.arrow.leftLabel || ''}</span><span class="arrow-head"></span><span class="arrow-line"></span>`;

  // Mnemo
  const mnemo = document.getElementById('mnemoContent');
  mnemo.innerHTML = step.mnemo();
  mnemo.scrollTop = 0;

  // Mnemo status
  const statusTags = ['就绪','写入中','写入中','写入中','处理中','查询中','生成中','反馈中','冲突处理'];
  document.getElementById('mnemoStatus').textContent = statusTags[current] || '处理中';

  // Bottom
  document.getElementById('stepBadge').textContent = `${current + 1}/${steps.length}`;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepDesc').textContent = step.desc;

  // Nav
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === steps.length - 1;
  if (current === steps.length - 1) {
    document.getElementById('nextBtn').textContent = '演示完成 ✓';
  } else {
    document.getElementById('nextBtn').innerHTML = '下一步 →';
  }

  // Animate process cards with stagger
  const cards = mnemo.querySelectorAll('.process-card');
  cards.forEach((card, i) => {
    card.classList.remove('visible');
    setTimeout(() => card.classList.add('visible'), 150 * i);
  });
}

function next() { if (current < steps.length - 1) { current++; render(); } }
function prev() { if (current > 0) { current--; render(); } }
function reset() { current = 0; render(); }

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

// Init
render();
</script>
