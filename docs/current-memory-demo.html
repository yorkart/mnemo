<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemo 当前实现 — 记忆处理动画演示</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #191d27;
  --surface: #232838;
  --surface2: #151924;
  --border: #303646;
  --border2: #242a38;
  --text: #e7eaf1;
  --muted: #9aa1b3;
  --soft: #c6cad7;
  --blue: #6c8cff;
  --cyan: #4ecdc4;
  --pink: #ff6b9d;
  --orange: #ffae57;
  --yellow: #f6d45a;
  --green: #5bd4a5;
  --red: #ff6b6b;
  --user: #2d5af0;
  --bot: #2a2f41;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.header {
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--blue), var(--cyan));
  display: grid;
  place-items: center;
  color: white;
  font-size: 13px;
  font-weight: 700;
}

.brand h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0;
  white-space: nowrap;
}

.runtime-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 99px;
  color: var(--muted);
  font-size: 11px;
}

.runtime-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.progress {
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 26px;
  height: 6px;
  border-radius: 6px;
  background: var(--border);
  cursor: pointer;
  transition: width .25s ease, background .25s ease;
  position: relative;
}

.dot.active { width: 42px; background: var(--blue); }
.dot.done { background: var(--cyan); }
.dot:hover::after {
  content: attr(data-title);
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  min-width: max-content;
  padding: 4px 8px;
  border-radius: 5px;
  background: #2b3040;
  color: white;
  font-size: 11px;
  z-index: 20;
}

.main {
  height: calc(100vh - 54px - 104px);
  display: grid;
  grid-template-columns: minmax(290px, 37vw) 56px minmax(480px, 1fr);
}

.chat, .mnemo {
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.chat {
  border-right: 1px solid var(--border);
  background: #10131b;
}

.pane-header {
  height: 42px;
  flex: 0 0 auto;
  padding: 0 15px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  font-size: 12px;
}

.pane-header .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.pane-header .spacer { flex: 1; }

.session-chip, .state-chip {
  color: var(--muted);
  font-size: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 99px;
}

.messages {
  flex: 1;
  min-height: 0;
  padding: 16px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.messages::-webkit-scrollbar,
.mnemo-body::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb,
.mnemo-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.message {
  max-width: 88%;
  padding: 10px 13px;
  border-radius: 12px;
  line-height: 1.55;
  font-size: 13px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .35s ease, transform .35s ease;
}

.message.show { opacity: 1; transform: translateY(0); }
.message.user { align-self: flex-end; background: var(--user); color: white; border-bottom-right-radius: 4px; }
.message.bot { align-self: flex-start; background: var(--bot); color: var(--text); border-bottom-left-radius: 4px; }
.message.system {
  align-self: center;
  max-width: 94%;
  background: transparent;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 99px;
  font-size: 11px;
  padding: 5px 12px;
}
.message.warn { border-color: rgba(255,174,87,.7); color: var(--orange); }
.message .label { color: rgba(255,255,255,.62); font-size: 10px; margin-bottom: 4px; }
.message.bot .label { color: var(--muted); }
.message .meta { color: rgba(255,255,255,.55); font-size: 10px; margin-top: 5px; text-align: right; }
.message.bot .meta { color: var(--muted); }

.bridge {
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, #10131b, #131722);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arrow {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .3s ease, transform .3s ease;
}

.arrow.show { opacity: 1; transform: translateY(0); }
.arrow.to-right { top: 29%; }
.arrow.to-left { bottom: 30%; flex-direction: row-reverse; }
.arrow-line { width: 24px; height: 2px; border-radius: 2px; }
.arrow.to-right .arrow-line { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.arrow.to-left .arrow-line { background: linear-gradient(90deg, var(--cyan), var(--blue)); }
.arrow-head { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.arrow.to-right .arrow-head { border-left: 8px solid var(--cyan); }
.arrow.to-left .arrow-head { border-right: 8px solid var(--blue); }
.arrow-label {
  position: absolute;
  left: 50%;
  top: -24px;
  transform: translateX(-50%);
  min-width: max-content;
  color: var(--muted);
  font-size: 10px;
}

.mnemo {
  background: var(--bg);
}

.mnemo-body {
  flex: 1;
  min-height: 0;
  padding: 15px;
  overflow: auto;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 11px;
  overflow: hidden;
  opacity: 0;
  transform: translateX(18px);
  transition: opacity .36s ease, transform .36s ease, border-color .2s ease;
}

.card.show { opacity: 1; transform: translateX(0); }
.card.good { border-left: 3px solid var(--green); }
.card.warn { border-left: 3px solid var(--orange); }
.card.stop { border-left: 3px solid var(--red); }

.card-h {
  padding: 8px 11px;
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 650;
}

.badge {
  width: 21px;
  height: 21px;
  flex: 0 0 21px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--blue);
  color: white;
  font-size: 10px;
  font-weight: 700;
}

.card-b {
  padding: 10px 12px 12px;
  color: var(--soft);
  font-size: 12px;
  line-height: 1.58;
}

.code {
  margin: 6px 0;
  padding: 9px 10px;
  border: 1px solid var(--border2);
  border-radius: 6px;
  background: #121722;
  color: var(--muted);
  font: 11px/1.55 "SF Mono", "Consolas", "Menlo", monospace;
  white-space: pre-wrap;
  overflow-x: auto;
}

.k { color: var(--blue); }
.s { color: var(--green); }
.n { color: var(--orange); }
.c { color: #687084; }
.hot { color: var(--yellow); }
.bad { color: var(--pink); }

.tag {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
}

.tag.blue { background: rgba(108,140,255,.14); color: var(--blue); }
.tag.green { background: rgba(91,212,165,.14); color: var(--green); }
.tag.cyan { background: rgba(78,205,196,.14); color: var(--cyan); }
.tag.orange { background: rgba(255,174,87,.15); color: var(--orange); }
.tag.red { background: rgba(255,107,107,.14); color: var(--red); }
.tag.yellow { background: rgba(246,212,90,.15); color: var(--yellow); }
.tag.gray { background: rgba(154,161,179,.12); color: var(--muted); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  margin: 6px 0;
}

th {
  padding: 6px 8px;
  text-align: left;
  color: var(--blue);
  background: #171c28;
  border-bottom: 1px solid var(--border);
  font-weight: 650;
}

td {
  padding: 5px 8px;
  border-bottom: 1px solid #202635;
  color: var(--soft);
  vertical-align: top;
}

tr.new td { color: var(--green); background: rgba(91,212,165,.05); }
tr.dim td { color: var(--muted); opacity: .62; }
tr.cut td { opacity: .48; text-decoration: line-through; }

.flow {
  display: grid;
  grid-template-columns: 28px 1fr;
  column-gap: 9px;
  row-gap: 5px;
  align-items: start;
  margin: 8px 0;
}

.flow-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
}

.flow-icon.db { color: var(--blue); background: rgba(108,140,255,.14); }
.flow-icon.ok { color: var(--green); background: rgba(91,212,165,.14); }
.flow-icon.job { color: var(--orange); background: rgba(255,174,87,.14); }
.flow-icon.stop { color: var(--red); background: rgba(255,107,107,.14); }
.flow-text strong { color: var(--text); }
.connector {
  grid-column: 1;
  width: 2px;
  height: 10px;
  margin-left: 13px;
  background: var(--border);
}

.ctx {
  padding: 10px 12px;
  margin: 7px 0;
  border-radius: 6px;
  border: 1px solid rgba(91,212,165,.55);
  background: #0d1519;
  color: var(--green);
  font: 11px/1.65 "SF Mono", "Consolas", "Menlo", monospace;
  white-space: pre-wrap;
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 8px 0 2px;
}

.metric {
  min-width: 0;
  padding: 8px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
}

.metric .v { color: var(--text); font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.metric .l { color: var(--muted); font-size: 10px; }

.bottom {
  height: 104px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

.step-info {
  min-width: 0;
  flex: 1;
}

.step-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 5px;
}

.step-count {
  background: var(--blue);
  color: white;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 650;
}

.step-desc {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  flex: 0 0 auto;
}

button {
  height: 34px;
  padding: 0 13px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease, opacity .15s ease;
}

button:hover { border-color: var(--blue); background: rgba(108,140,255,.11); }
button:disabled { opacity: .35; cursor: default; }
button:disabled:hover { border-color: var(--border); background: var(--surface); }
button.primary { background: var(--blue); border-color: var(--blue); color: white; }
button.primary:hover { background: #5b78e5; }

.pulse {
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: .45; }
  50% { opacity: 1; }
}

@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  .header { height: auto; min-height: 54px; gap: 12px; flex-wrap: wrap; padding: 12px 14px; }
  .brand h1 { white-space: normal; }
  .main { height: auto; display: block; }
  .chat, .mnemo { height: auto; min-height: 420px; }
  .bridge { display: none; }
  .messages, .mnemo-body { max-height: none; overflow: visible; }
  .bottom { height: auto; min-height: 104px; align-items: stretch; flex-direction: column; padding: 12px 14px; }
  .controls { width: 100%; justify-content: stretch; }
  button { flex: 1; }
  .mini-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark">M</div>
      <h1>Mnemo 当前实现 — 记忆处理动画演示</h1>
      <span class="runtime-pill">SQLite runtime</span>
    </div>
    <nav class="progress" id="progress"></nav>
  </header>

  <main class="main">
    <section class="chat">
      <div class="pane-header">
        <span class="status-dot"></span>
        <span>调用方与用户交互</span>
        <span class="spacer"></span>
        <span class="session-chip" id="sessionChip">thread: setup</span>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <aside class="bridge">
      <div class="arrow to-right" id="arrowRight">
        <span class="arrow-label" id="rightLabel"></span>
        <span class="arrow-line"></span>
        <span class="arrow-head"></span>
      </div>
      <div class="arrow to-left" id="arrowLeft">
        <span class="arrow-label" id="leftLabel"></span>
        <span class="arrow-head"></span>
        <span class="arrow-line"></span>
      </div>
    </aside>

    <section class="mnemo">
      <div class="pane-header">
        <span style="color:var(--blue);font-weight:700">◆</span>
        <span>Mnemo 内部状态</span>
        <span class="spacer"></span>
        <span class="state-chip" id="stateChip">ready</span>
      </div>
      <div class="mnemo-body" id="mnemoBody"></div>
    </section>
  </main>

  <footer class="bottom">
    <div class="step-info">
      <div class="step-title">
        <span class="step-count" id="stepCount">1/8</span>
        <span id="stepTitle">启动服务</span>
      </div>
      <div class="step-desc" id="stepDesc"></div>
    </div>
    <div class="controls">
      <button type="button" id="playBtn" onclick="togglePlay()">播放</button>
      <button type="button" onclick="resetDemo()">重置</button>
      <button type="button" id="prevBtn" onclick="prevStep()">上一步</button>
      <button type="button" id="nextBtn" class="primary" onclick="nextStep()">下一步</button>
    </div>
  </footer>

<script>
const steps = [
  {
    title: "启动服务：SQLite 是运行时存储",
    desc: "当前实现只保留 SQLite runtime；服务可用本地 JSON snapshot 或 --sqlite 路径启动。主路径没有 raw query 召回，读取口是 context pack。",
    session: "thread: bootstrap",
    state: "serve --sqlite",
    arrows: { right: false, left: false },
    chat: [
      { type: "system", text: "开发者启动 Mnemo 服务：mnemo serve --sqlite ./mnemo.db" },
      { type: "system", text: "调用方负责接入 Agent；Mnemo 只提供事件接收、记忆整理和 context pack。" }
    ],
    mnemo: () => `
      <div class="card show good">
        <div class="card-h"><span class="badge">S</span>服务边界</div>
        <div class="card-b">
          <div class="mini-grid">
            <div class="metric"><div class="v">SQLite</div><div class="l">运行时持久化</div></div>
            <div class="metric"><div class="v">HTTP API</div><div class="l">调用方适配入口</div></div>
            <div class="metric"><div class="v">CLI</div><div class="l">调试和管理</div></div>
          </div>
          <div class="code"><span class="k">mnemo serve</span> --addr <span class="s">127.0.0.1:8080</span> --sqlite <span class="s">./mnemo.db</span>
<span class="k">mnemo db init</span> --path <span class="s">./mnemo.db</span></div>
        </div>
      </div>
      <div class="card show">
        <div class="card-h"><span class="badge">DB</span>核心表</div>
        <div class="card-b">
          <table>
            <tr><th>表</th><th>职责</th><th>是否主路径</th></tr>
            <tr><td>events</td><td>原始交互事实源，写入不依赖模型</td><td><span class="tag green">是</span></td></tr>
            <tr><td>memories</td><td>当前有效 canonical memory</td><td><span class="tag green">是</span></td></tr>
            <tr><td>jobs</td><td>异步 wrapup worker 队列和重试状态</td><td><span class="tag blue">后台</span></td></tr>
            <tr><td>session_summaries</td><td>会话压缩结果和来源事件</td><td><span class="tag blue">后台</span></td></tr>
            <tr><td>context_pack_cache_entries</td><td>context pack 缓存</td><td><span class="tag green">是</span></td></tr>
            <tr><td>usage_reports / forget_tombstones</td><td>反馈与遗忘审计</td><td><span class="tag orange">管理</span></td></tr>
          </table>
        </div>
      </div>`
  },
  {
    title: "事件写入：原始交互先落库",
    desc: "用户消息和 Agent 回复通过 /v1/events 写入。幂等由 namespace_key + event_id + fingerprint 保证；同 ID 同内容去重，不同内容返回 event_conflict。",
    session: "thread: t-001",
    state: "events accepted",
    arrows: { right: true, left: false, rightLabel: "POST /v1/events" },
    chat: [
      { type: "system", text: "同一条演示时间线：小王在 mnemo 项目里开启第一次会话 t-001" },
      { type: "user", text: "我们这个项目统一用 Rust 写后端，请记住。", meta: "evt-001 · explicit_memory_intent=true" },
      { type: "bot", text: "好的，我会把它作为项目约定记住。", meta: "evt-002" },
      { type: "bot", text: "我还查到了外部文档里推荐 axum。", meta: "evt-003 · external_context=true" }
    ],
    mnemo: () => `
      <div class="card show good">
        <div class="card-h"><span class="badge">1</span>写入请求</div>
        <div class="card-b">
          <div class="code">{
  <span class="k">"event_id"</span>: <span class="s">"evt-001"</span>,
  <span class="k">"namespace"</span>: { <span class="k">"user_id"</span>: <span class="s">"u1"</span>, <span class="k">"workspace_id"</span>: <span class="s">"mnemo"</span>, <span class="k">"thread_id"</span>: <span class="s">"t-001"</span> },
  <span class="k">"type"</span>: <span class="s">"user_message"</span>,
  <span class="k">"role"</span>: <span class="s">"user"</span>,
  <span class="k">"content"</span>: <span class="s">"我们这个项目统一用 Rust 写后端，请记住。"</span>,
  <span class="k">"memory_hints"</span>: { <span class="k">"eligible"</span>: <span class="n">true</span>, <span class="k">"explicit_memory_intent"</span>: <span class="n">true</span>, <span class="k">"external_context"</span>: <span class="n">false</span> }
}</div>
        </div>
      </div>
      <div class="card show">
        <div class="card-h"><span class="badge">2</span>事件表状态</div>
        <div class="card-b">
          <table>
            <tr><th>event_id</th><th>role</th><th>hints</th><th>后续整理</th></tr>
            <tr class="new"><td>evt-001</td><td>user</td><td>eligible + explicit intent</td><td><span class="tag green">可抽取</span></td></tr>
            <tr><td>evt-002</td><td>assistant</td><td>普通回复</td><td><span class="tag gray">只进 summary</span></td></tr>
            <tr class="dim"><td>evt-003</td><td>assistant</td><td>external_context=true</td><td><span class="tag orange">不沉淀长期记忆</span></td></tr>
          </table>
          <div class="flow"><div class="flow-icon ok">✓</div><div class="flow-text"><strong>关键约束</strong><br>事件写入不调用模型；即使 wrapup provider 不可用，原始事件仍可靠保存。</div></div>
        </div>
      </div>`
  },
  {
    title: "显式记忆：直接进入 Memory Store",
    desc: "调用方识别到用户明确要求“记住”时，可直接调用 /v1/memories。conflict_key 表示同一事实槽位，后续写入同槽位会自动 supersede 旧 active memory。",
    session: "thread: t-001",
    state: "memory written",
    arrows: { right: true, left: true, rightLabel: "POST /v1/memories", leftLabel: "memory_id" },
    chat: [
      { type: "system", text: "t-001 继续：调用方刚刚把这轮对话写入 events" },

let current = 0;
let playing = false;
let timer = null;

function render() {
  const step = steps[current];
  document.getElementById("sessionChip").textContent = step.session;
  document.getElementById("stateChip").textContent = step.state;
  document.getElementById("stepCount").textContent = `${current + 1}/${steps.length}`;
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("stepDesc").textContent = step.desc;

  const progress = document.getElementById("progress");
  progress.innerHTML = "";
  steps.forEach((item, index) => {
    const dot = document.createElement("div");
    dot.className = "dot" + (index === current ? " active" : index < current ? " done" : "");
    dot.dataset.title = item.title;
    dot.onclick = () => {
      current = index;
      stopPlay();
      render();
    };
    progress.appendChild(dot);
  });

  const messages = document.getElementById("messages");
  messages.innerHTML = "";
  step.chat.forEach((message, index) => {
    const node = document.createElement("div");
    node.className = `message ${message.type} ${message.className || ""}`;
    let html = "";
    if (message.type === "user") html += `<div class="label">用户</div>`;
    if (message.type === "bot") html += `<div class="label">Agent</div>`;
    html += `<div>${message.text}</div>`;
    if (message.meta) html += `<div class="meta">${message.meta}</div>`;
    node.innerHTML = html;
    messages.appendChild(node);
    setTimeout(() => node.classList.add("show"), 70 * index);
  });
  setTimeout(() => { messages.scrollTop = messages.scrollHeight; }, 80);

  const arrowRight = document.getElementById("arrowRight");
  const arrowLeft = document.getElementById("arrowLeft");
  arrowRight.className = "arrow to-right" + (step.arrows.right ? " show pulse" : "");
  arrowLeft.className = "arrow to-left" + (step.arrows.left ? " show pulse" : "");
  document.getElementById("rightLabel").textContent = step.arrows.rightLabel || "";
  document.getElementById("leftLabel").textContent = step.arrows.leftLabel || "";

  const body = document.getElementById("mnemoBody");
  body.innerHTML = step.mnemo();
  body.scrollTop = 0;
  body.querySelectorAll(".card").forEach((card, index) => {
    card.classList.remove("show");
    setTimeout(() => card.classList.add("show"), 120 * index);
  });

  document.getElementById("prevBtn").disabled = current === 0;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = current === steps.length - 1;
  nextBtn.textContent = current === steps.length - 1 ? "演示完成" : "下一步";
  document.getElementById("playBtn").textContent = playing ? "暂停" : "播放";
}

function nextStep() {
  if (current < steps.length - 1) {
    current += 1;
    render();
  } else {
    stopPlay();
  }
}

function prevStep() {
  if (current > 0) {
    current -= 1;
    stopPlay();
    render();
  }
}

function resetDemo() {
  current = 0;
  stopPlay();
  render();
}

function togglePlay() {
  if (playing) {
    stopPlay();
  } else {
    playing = true;
    document.getElementById("playBtn").textContent = "暂停";
    timer = setInterval(() => {
      if (current >= steps.length - 1) {
        stopPlay();
        return;
      }
      current += 1;
      render();
    }, 3600);
  }
}

function stopPlay() {
  playing = false;
  if (timer) clearInterval(timer);
  timer = null;
  const playBtn = document.getElementById("playBtn");
  if (playBtn) playBtn.textContent = "播放";
}

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === " ") {
    event.preventDefault();
    nextStep();
  }
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    prevStep();
  }
});

render();
</script>
