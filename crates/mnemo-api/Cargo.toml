[package]
name = "mnemo-api"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
mnemo-core = { path = "../mnemo-core" }
mnemo-store = { path = "../mnemo-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[lib]
path = "src/lib.rs"
